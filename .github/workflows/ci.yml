name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Só cancela execuções antigas em PRs; na main elas entram em fila para não
  # interromper um deploy no meio.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------
  # CI: instala dependências, compila e testa todos os workspaces
  # ---------------------------------------------------------------
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências (workspaces)
        run: npm ci

      - name: Build de todos os serviços e do frontend
        run: npm run build

      - name: Testes
        run: npm test

  # ---------------------------------------------------------------
  # Valida que cada Dockerfile builda (em PRs não publica nada)
  # ---------------------------------------------------------------
  docker:
    name: Docker (${{ matrix.service.name }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: api-gateway, context: services/api-gateway }
          - { name: users-service, context: services/users-service }
          - { name: products-service, context: services/products-service }
          - { name: orders-service, context: services/orders-service }
          - { name: payments-service, context: services/payments-service }
          - { name: logistics-service, context: services/logistics-service }
          - { name: notifications-service, context: services/notifications-service }
          - { name: paypal-mock, context: services/paypal-mock }
          - { name: iot-simulator, context: services/iot-simulator }
          - { name: frontend, context: frontend }
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem em minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/districommerce-${{ matrix.service.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login no GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags da imagem
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build (e push, se for a main)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.service.context }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ---------------------------------------------------------------
  # CD: publica na VM (só em push na main, depois das imagens no GHCR)
  # Secrets necessários: VM_HOST, VM_USER, VM_SSH_KEY
  # ---------------------------------------------------------------
  deploy:
    name: Deploy na VM
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      SITE_URL: https://districommerce.duckdns.org
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # Reconstrói a chave privada: remove CRLF/espaços (colar do Windows costuma
          # estragar as quebras de linha) e refaz o formato BEGIN/END com linhas de 70 colunas.
          body=$(printf '%s' "$VM_SSH_KEY" | tr -d '\r' \
            | sed -e 's/-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----//' \
            | tr -d ' \n')
          # Diagnóstico seguro (não imprime a chave)
          echo "Secret tem BEGIN: $(printf '%s' "$VM_SSH_KEY" | grep -c 'BEGIN OPENSSH PRIVATE KEY') | END: $(printf '%s' "$VM_SSH_KEY" | grep -c 'END OPENSSH PRIVATE KEY') | tamanho do corpo: ${#body} caracteres (esperado ~400)"
          {
            echo '-----BEGIN OPENSSH PRIVATE KEY-----'
            printf '%s' "$body" | fold -w 70
            echo
            echo '-----END OPENSSH PRIVATE KEY-----'
          } > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null || { echo "::error::VM_SSH_KEY inválida: recrie o secret com a chave privada completa (BEGIN...END)"; exit 1; }
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          printf 'Host vm\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  ServerAliveInterval 30\n' "$VM_HOST" "$VM_USER" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Copiar compose, infra e loadtest para a VM
        run: |
          ssh vm 'mkdir -p ~/computacao-distribuida'
          scp -r docker-compose.yml docker-compose.prod.yml infra loadtest vm:~/computacao-distribuida/

      # Caddy e Prometheus leem arquivos de configuração montados do disco: container que não
      # foi recriado não relê sozinho, então recarregamos (Caddy sem derrubar conexões).
      - name: Baixar as imagens do commit e subir os containers
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          printf '%s' "$GHCR_TOKEN" | ssh vm "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh vm "cd ~/computacao-distribuida \
            && export IMAGE_OWNER='$IMAGE_OWNER' IMAGE_TAG='$IMAGE_TAG' COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml \
            && docker compose pull \
            && docker compose up -d --no-build --remove-orphans \
            && (docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true) \
            && docker compose restart prometheus \
            && docker image prune -f"

      - name: Teste de fumaça no site publicado
        run: |
          for i in $(seq 1 24); do
            if curl -fsS --max-time 10 -o /dev/null "$SITE_URL/" && curl -fsS --max-time 10 -o /dev/null "$SITE_URL/services"; then
              echo "OK: $SITE_URL no ar (commit ${GITHUB_SHA::7})"
              exit 0
            fi
            echo "tentativa $i falhou, aguardando..."
            sleep 5
          done
          echo "O site não respondeu após o deploy"
          exit 1

      - name: Logout do GHCR (VM)
        if: always()
        run: ssh vm 'docker logout ghcr.io' || true
