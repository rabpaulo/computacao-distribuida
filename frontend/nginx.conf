server {
    listen 3000;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Notificações em tempo real (Server-Sent Events): a resposta nunca termina,
    # então nada de buffer nem timeout curto, senão o evento só chega com atraso.
    location = /api/v1/notifications/stream {
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy para o API Gateway
    location /api/ {
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Telas de monitoramento (Grafana, Prometheus, RabbitMQ) servidas pelo gateway.
    # Host com a porta ($http_host): o Grafana confere Host contra o Origin do navegador.
    location /tools/ {
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
    }

    location /services {
        proxy_pass http://api-gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
