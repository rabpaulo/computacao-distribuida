# Broker MQTT da frota de entregas (DistriCommerce)
listener 1883
protocol mqtt

# Ambiente de desenvolvimento/demo: sem autenticacao.
# Em producao: password_file + ACL por caminhao e TLS (listener 8883).
allow_anonymous true

# Sessoes persistentes (clean=false) e mensagens retained sobrevivem a restart
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
