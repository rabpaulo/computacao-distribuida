apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: districommerce-ingress
  namespace: districommerce
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Roteamento da API para o API Gateway
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
          - path: /services
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
          # Roteamento do Frontend (SPA)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
