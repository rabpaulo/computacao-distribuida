apiVersion: v1
kind: Secret
metadata:
  name: districommerce-secrets
  namespace: districommerce
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgrespassword"
  MONGO_ROOT_PASSWORD: "rootpassword"
  JWT_SECRET: "districommerce-production-jwt-secret-key-32-bytes"
  RABBITMQ_USER: "admin"
  RABBITMQ_PASSWORD: "admin"
  # URL completa consumida pelos microsservicos (credenciais embutidas).
  RABBITMQ_URL: "amqp://admin:admin@rabbitmq:5672"
