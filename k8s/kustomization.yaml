apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: districommerce

resources:
  - namespace.yaml
  - configmaps/common-config.yaml
  - secrets/common-secrets.yaml
  - databases/postgres.yaml
  - databases/mongodb.yaml
  - messaging/rabbitmq.yaml
  - iot/mosquitto.yaml
  - iot/iot-simulator.yaml
  - services/users-service.yaml
  - services/products-service.yaml
  - services/orders-service.yaml
  - services/payments-service.yaml
  - services/paypal-mock.yaml
  - services/logistics-service.yaml
  - services/api-gateway.yaml
  - services/frontend.yaml
  - ingress.yaml
